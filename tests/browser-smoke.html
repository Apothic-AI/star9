<!doctype html>
<meta charset="utf-8">
<title>star9-web smoke</title>

<script>
  window.__star9SmokeStore = {};
</script>

<star9-system
  id="smoke-system"
  pkg="../target/star9-web-pkg/star9_web.js"
>
  <star9-bind kind="ns" type="ns" dst="." src="#ramfs"></star9-bind>
  <star9-bind kind="file" type="file" dst="inline.txt">inline-browser-ok</star9-bind>
  <star9-bind
    kind="file"
    type="file"
    dst="fetched.txt"
    src="./fixtures/browser/registered-file.txt"
  ></star9-bind>
  <star9-bind
    kind="ns"
    type="ns"
    dst="cache-store"
    storage='{"backend":"cache","cache":"star9-smoke","path":"root"}'
  ></star9-bind>
  <star9-bind
    kind="ns"
    type="ns"
    dst="dom-store"
    storage='{"backend":"dom","node":"#status"}'
  ></star9-bind>
  <star9-bind
    kind="ns"
    type="ns"
    dst="shared-store"
    storage='{"backend":"js-value","value":"window.__star9SmokeStore"}'
  ></star9-bind>
  <star9-bind
    kind="ns"
    type="ns"
    dst="shared-store-2"
    storage='{"backend":"js-value","value":"window.__star9SmokeStore"}'
  ></star9-bind>
  <star9-terminal id="smoke-terminal"></star9-terminal>
  <star9-terminal id="smoke-raw-terminal" raw></star9-terminal>
</star9-system>

<pre id="status">running</pre>

<script type="module">
  import "../crates/star9-web/js/star9-elements.js";
  import { createStar9P9FramePort } from "../crates/star9-web/js/p9-port.js";
  import { createStar9Shell } from "../crates/star9-web/js/shell.js";

  const status = document.querySelector("#status");
  const systemElement = document.querySelector("#smoke-system");
  const assert = (condition, message) => {
    if (!condition) throw new Error(message);
  };
  const entriesOf = async (path, system) => Array.from(await system.readDir(path));
  const numericTaskIds = (entries) =>
    entries
      .map((entry) => entry.replace(/\/$/, ""))
      .filter((entry) => /^\d+$/.test(entry))
      .map((entry) => Number(entry))
      .sort((left, right) => left - right);

  const waitForReady = (element, timeoutMs = 10000) =>
    new Promise((resolve, reject) => {
      if (element.isReady === true) {
        resolve({ detail: { system: element.system ?? element } });
        return;
      }

      const timeout = window.setTimeout(() => {
        cleanup();
        reject(new Error(`timed out waiting for ${element.tagName.toLowerCase()} ready`));
      }, timeoutMs);

      const cleanup = () => {
        window.clearTimeout(timeout);
        element.removeEventListener("ready", onReady);
        element.removeEventListener("error", onError);
      };

      const onReady = (event) => {
        cleanup();
        resolve(event);
      };

      const onError = (event) => {
        cleanup();
        const detail = event && event.detail ? event.detail.error ?? event.detail : event;
        reject(detail instanceof Error ? detail : new Error(String(detail)));
      };

      element.addEventListener("ready", onReady, { once: true });
      element.addEventListener("error", onError, { once: true });
    });

  try {
    const readyEvent = await waitForReady(systemElement);
    const system = readyEvent.detail.system;
    const terminalElement = document.querySelector("#smoke-terminal");
    const rawTerminalElement = document.querySelector("#smoke-raw-terminal");
    await waitForReady(terminalElement);
    await waitForReady(rawTerminalElement);

    const version = (await system.readText("#star9/version")).trim();
    const inlineText = (await system.readText("inline.txt")).trim();
    const fetchedText = (await system.readText("fetched.txt")).trim();

    const shell = createStar9Shell(systemElement);
    const shellResult = await shell.eval("mkdir shell-demo; write shell-demo/hello shell-ok; cat shell-demo/hello");
    const shellPwd = await shell.eval("cd shell-demo; pwd");

    await system.writeText("cache-store/state.txt", "storage-ok");
    const storageText = await system.readText("cache-store/state.txt");
    const storageEntries = await entriesOf("cache-store", system);

    await system.writeText("dom-store/textContent", "dom-storage-ok");
    const domStorageText = await system.readText("dom-store/textContent");

    await system.writeText("shared-store/state.txt", "descriptor-ok");
    const sharedMirrorText = (await system.readText("shared-store-2/state.txt")).trim();
    const sharedEntries = await entriesOf("shared-store-2", system);

    const terminalState = await terminalElement.writeData("browser-screen");
    await terminalElement.resize(100, 30);
    const terminalResized = await terminalElement.refresh();
    await terminalElement.writeProgram("\nnormal\n");
    const normalizedProgram = await system.readText(terminalElement.path("program"));
    await rawTerminalElement.writeProgram("\nraw\n");
    const rawProgram = await system.readText(rawTerminalElement.path("raw"));
    await terminalElement.reset();
    const terminalReset = await terminalElement.refresh();

    const portImport = await createStar9P9FramePort(system);
    await system.mountImportPort("remote-port", portImport.port);
    const remotePortInlineText = (await system.readText("remote-port/inline.txt")).trim();
    await system.writeText("remote-port/port-created.txt", "port-ok");
    const remotePortCreatedText = (await system.readText("port-created.txt")).trim();
    const remotePortEntries = await entriesOf("remote-port", system);
    system.unmount("remote-port");
    portImport.server.close();

    system.mountSelf9p("remote");
    const remoteInlineText = (await system.readText("remote/inline.txt")).trim();
    const remoteFetchedText = (await system.readText("remote/fetched.txt")).trim();

    if (navigator.storage && typeof navigator.storage.getDirectory === "function") {
      await system.mountStorage("opfs-store", { backend: "opfs", root: "star9-smoke" });
      await system.writeText("opfs-store/state.txt", "opfs-ok");
      const opfsText = await system.readText("opfs-store/state.txt");
      assert(opfsText === "opfs-ok", `bad opfs text ${opfsText}`);
    }

    const taskEntriesBefore = await entriesOf("#task", system);
    const wasiTask = system.startWasi("repl.wasm");
    let taskOpfsText = "skipped";
    let taskOpfsRemountText = "skipped";
    let taskStarFsText = "skipped";
    let taskStarFsKvText = "skipped";
    let taskStorageEntries = [];
    let starFsEntries = [];
    if (navigator.storage && typeof navigator.storage.getDirectory === "function") {
      await system.mountTaskStorage(wasiTask, "storage/opfs", {
        backend: "opfs",
        root: "star9-smoke-task-opfs",
      });
      await system.writeText(`#task/${wasiTask}/ns/storage/opfs/state.txt`, "task-opfs-ok");
      taskOpfsText = (await system.readText(`#task/${wasiTask}/ns/storage/opfs/state.txt`)).trim();
      taskStorageEntries = await entriesOf(`#task/${wasiTask}/ns/storage/opfs`, system);
      system.unmount(`#task/${wasiTask}/ns/storage/opfs`);
      await system.mountTaskStorage(wasiTask, "storage/opfs", {
        backend: "opfs",
        root: "star9-smoke-task-opfs",
      });
      taskOpfsRemountText = (await system.readText(`#task/${wasiTask}/ns/storage/opfs/state.txt`)).trim();

      await system.mountStarFs("starfs-store", {
        id: "smoke-agent",
        storage: { backend: "opfs", root: "star9-smoke-starfs" },
      });
      await system.writeText("starfs-store/report.txt", "starfs-ok");
      await system.writeText("starfs-store/.starfs/kv/prefs.json", "{\"theme\":\"dark\"}");
      taskStarFsText = (await system.readText("starfs-store/report.txt")).trim();
      taskStarFsKvText = (await system.readText("starfs-store/.starfs/kv/prefs.json")).trim();
      starFsEntries = await entriesOf("starfs-store", system);
    }
    const taskEntriesAfterWasi = await entriesOf("#task", system);
    const goTask = system.startGoJs("repl-gojs.wasm");
    const taskEntriesAfterGo = await entriesOf("#task", system);
    const wasiCmd = (await system.readText(`#task/${wasiTask}/cmd`)).trim();
    const wasiExit = (await system.readText(`#task/${wasiTask}/exit`)).trim();
    const goCmd = (await system.readText(`#task/${goTask}/cmd`)).trim();
    const goExit = (await system.readText(`#task/${goTask}/exit`)).trim();

    const workerTask = await system.startBrowserWorker("./fixtures/browser/execution-worker.mjs", {
      workerId: "smoke-exec-worker",
      module: "../../../tests/fixtures/js-wasm-execution-runner.mjs",
      args: ["--browser-smoke"],
      env: [{ name: "FIXTURE_EXIT_CODE", value: "0" }],
      cwd: "tmp",
    });
    await waitFor(() => workerTask.exitCode === 0, "worker task exit");
    const workerPort = system.openWorkerPort(workerTask.worker, {
      port_id: "smoke-events",
      name: "smoke-events",
    });
    const handedPort = system.handoffWorkerPort(workerTask.worker, goTask, workerPort);
    const workerExit = (await system.readText(`#task/${workerTask.taskId}/exit`)).trim();
    const workerCmd = (await system.readText(`#task/${workerTask.taskId}/cmd`)).trim();
    const workerMessages = workerTask.messages.slice();
    workerTask.close();

    const directWasmTask = await system.startBrowserWorker("./fixtures/browser/execution-worker.mjs", {
      workerId: "smoke-direct-wasm-worker",
      module: "../../../tests/fixtures/wasi-preview1-smoke.wasm",
      args: ["--browser-direct-wasm"],
      env: [{ name: "MODE", value: "browser" }],
      cwd: "tmp",
    });
    await waitFor(() => directWasmTask.exitCode === 0, "direct wasm worker exit");
    const directWasmExit = (await system.readText(`#task/${directWasmTask.taskId}/exit`)).trim();
    const directWasmCmd = (await system.readText(`#task/${directWasmTask.taskId}/cmd`)).trim();
    const directWasmStdout = directWasmTask.messages.find((message) => message === "compiled-wasi-ok\n");
    directWasmTask.close();

    const goCompatWorker = await system.startBrowserWorker("./fixtures/browser/execution-worker.mjs", {
      workerId: "smoke-go-compatible-worker",
      kind: "gojs",
      module: "../../../tests/fixtures/go-compatible-runner.mjs",
      args: ["--browser-go-compatible"],
      env: [{ name: "GO_COMPAT_EXIT_CODE", value: "0" }],
      cwd: "go-workspace",
    });
    await waitFor(() => goCompatWorker.exitCode === 0, "go-compatible worker exit");
    const goCompatExit = (await system.readText(`#task/${goCompatWorker.taskId}/exit`)).trim();
    const goCompatCmd = (await system.readText(`#task/${goCompatWorker.taskId}/cmd`)).trim();
    const goCompatStdout = goCompatWorker.messages.find((message) => message === "go-compatible-ok\n");
    goCompatWorker.close();

    const vmId = (await system.readText("#vm/new/v86")).trim();
    const exportWorker = await system.startBrowserWorker(`./fixtures/browser/export-worker.mjs?vm=${vmId}`, {
      workerId: "smoke-export-worker",
      module: "../../../tests/fixtures/js-wasm-execution-runner.mjs",
      args: [],
      env: [{ name: "FIXTURE_EXIT_CODE", value: "0" }],
      cwd: "tmp",
    });
    await waitFor(() => exportWorker.exportMounts.length === 1, "worker export mount");
    const taskExportText = (await system.readText(`#task/${exportWorker.taskId}/export/guest.txt`)).trim();
    const vmGuestText = (await system.readText(`#vm/${vmId}/guest/guest.txt`)).trim();
    await system.writeText(`#task/${exportWorker.taskId}/export/export-created.txt`, "export-write-ok");
    const taskExportCreated = (await system.readText(`#task/${exportWorker.taskId}/export/export-created.txt`)).trim();
    const taskExportEntries = await entriesOf(`#task/${exportWorker.taskId}/export`, system);
    exportWorker.close();

    assert(version === "0.1.0", `bad version ${version}`);
    assert(inlineText === "inline-browser-ok", `bad inline text ${inlineText}`);
    assert(fetchedText === "registered-browser-ok", `bad fetched text ${fetchedText}`);
    assert(shellResult.status === 0, `bad shell status ${shellResult.status}: ${shellResult.stderr}`);
    assert(shellResult.stdout === "shell-ok", `bad shell stdout ${JSON.stringify(shellResult.stdout)}`);
    assert(shellPwd.stdout === "shell-demo\n", `bad shell pwd ${JSON.stringify(shellPwd.stdout)}`);
    assert(storageText === "storage-ok", `bad storage text ${storageText}`);
    assert(
      sharedMirrorText === "descriptor-ok",
      `bad shared storage text ${sharedMirrorText}`,
    );
    assert(
      remoteInlineText === "inline-browser-ok",
      `bad remote inline text ${remoteInlineText}`,
    );
    assert(
      remoteFetchedText === "registered-browser-ok",
      `bad remote fetched text ${remoteFetchedText}`,
    );
    assert(
      remotePortInlineText === "inline-browser-ok",
      `bad remote port inline text ${remotePortInlineText}`,
    );
    assert(
      remotePortCreatedText === "port-ok",
      `bad remote port created text ${remotePortCreatedText}`,
    );
    assert(
      remotePortEntries.includes("port-created.txt"),
      `missing remote port entry: ${remotePortEntries}`,
    );
    assert(
      domStorageText === "dom-storage-ok",
      `bad dom storage text ${domStorageText}`,
    );
    assert(
      storageEntries.includes("state.txt"),
      `missing storage entry: ${storageEntries}`,
    );
    assert(
      sharedEntries.includes("state.txt"),
      `missing shared entry: ${sharedEntries}`,
    );
    assert(terminalState.screen === "browser-screen", `bad terminal screen ${terminalState.screen}`);
    assert(terminalResized.size === "100x30", `bad terminal resize ${terminalResized.size}`);
    assert(normalizedProgram === "\r\nnormal\r\n", `bad normalized program ${JSON.stringify(normalizedProgram)}`);
    assert(rawProgram === "\nraw\n", `bad raw program ${JSON.stringify(rawProgram)}`);
    assert(terminalReset.screen === "", `terminal reset did not clear screen ${terminalReset.screen}`);
    assert(terminalReset.size === "80x24", `terminal reset did not restore size ${terminalReset.size}`);
    assert(Boolean(wasiTask) && Boolean(goTask) && wasiTask !== goTask, "bad task ids");
    assert(wasiCmd === "repl.wasm", `bad wasi cmd ${wasiCmd}`);
    assert(goCmd === "repl-gojs.wasm", `bad go cmd ${goCmd}`);
    assert(wasiExit === "started", `bad wasi exit ${wasiExit}`);
    assert(goExit === "started", `bad go exit ${goExit}`);
    assert(taskOpfsText === "skipped" || taskOpfsText === "task-opfs-ok", `bad task opfs text ${taskOpfsText}`);
    assert(taskOpfsRemountText === "skipped" || taskOpfsRemountText === "task-opfs-ok", `bad task opfs remount ${taskOpfsRemountText}`);
    assert(taskStorageEntries.length === 0 || taskStorageEntries.includes("state.txt"), `missing task storage entry: ${taskStorageEntries}`);
    assert(taskStarFsText === "skipped" || taskStarFsText === "starfs-ok", `bad starfs text ${taskStarFsText}`);
    assert(taskStarFsKvText === "skipped" || taskStarFsKvText === "{\"theme\":\"dark\"}", `bad starfs kv ${taskStarFsKvText}`);
    assert(starFsEntries.length === 0 || starFsEntries.includes(".starfs"), `missing starfs control dir: ${starFsEntries}`);
    assert(workerExit === "0", `bad worker exit ${workerExit}`);
    assert(
      workerCmd === "../../../tests/fixtures/js-wasm-execution-runner.mjs --browser-smoke",
      `bad worker cmd ${workerCmd}`,
    );
    assert(
      workerMessages.some((message) => message && message.args && message.args.includes("--browser-smoke")),
      `missing worker payload: ${JSON.stringify(workerMessages)}`,
    );
    assert(handedPort.port_id === "smoke-events", `bad handed port ${JSON.stringify(handedPort)}`);
    assert(directWasmExit === "0", `bad direct wasm exit ${directWasmExit}`);
    assert(
      directWasmCmd === "../../../tests/fixtures/wasi-preview1-smoke.wasm --browser-direct-wasm",
      `bad direct wasm cmd ${directWasmCmd}`,
    );
    assert(directWasmStdout === "compiled-wasi-ok\n", `bad direct wasm stdout ${directWasmStdout}`);
    assert(goCompatExit === "0", `bad go-compatible exit ${goCompatExit}`);
    assert(
      goCompatCmd === "../../../tests/fixtures/go-compatible-runner.mjs --browser-go-compatible",
      `bad go-compatible cmd ${goCompatCmd}`,
    );
    assert(goCompatStdout === "go-compatible-ok\n", `bad go-compatible stdout ${goCompatStdout}`);
    assert(taskExportText === "worker-export-ok", `bad task export text ${taskExportText}`);
    assert(vmGuestText === "worker-export-ok", `bad vm guest text ${vmGuestText}`);
    assert(taskExportCreated === "export-write-ok", `bad task export write ${taskExportCreated}`);
    assert(
      taskExportEntries.includes("export-created.txt"),
      `missing task export entry: ${taskExportEntries}`,
    );
    assert(
      numericTaskIds(taskEntriesAfterWasi).includes(Number(wasiTask)),
      `missing wasi task entry: ${taskEntriesAfterWasi}`,
    );
    assert(
      numericTaskIds(taskEntriesAfterGo).includes(Number(goTask)),
      `missing go task entry: ${taskEntriesAfterGo}`,
    );
    assert(
      numericTaskIds(taskEntriesBefore).includes(1),
      `missing root task entry: ${taskEntriesBefore}`,
    );
    assert(
      Number(goTask) === Number(wasiTask) + 1,
      `bad task order ${wasiTask}, ${goTask}`,
    );

    document.body.dataset.status = "ok";
    status.textContent = JSON.stringify(
      {
        version,
        inlineText,
        fetchedText,
        shellPwd: shellPwd.stdout.trim(),
        storageEntries,
        sharedEntries,
        remotePortEntries,
        domStorageText,
        wasiTask,
        taskOpfsText,
        taskOpfsRemountText,
        taskStorageEntries,
        taskStarFsText,
        starFsEntries,
        goTask,
        workerTask: workerTask.taskId,
        workerExit,
        directWasmTask: directWasmTask.taskId,
        directWasmExit,
        goCompatTask: goCompatWorker.taskId,
        goCompatExit,
        exportTask: exportWorker.taskId,
        vmId,
        taskExportEntries,
        terminalSize: terminalReset.size,
        handedPort,
        taskEntriesAfterGo,
      },
      null,
      2,
    );
  } catch (err) {
    document.body.dataset.status = "error";
    status.textContent = err && err.stack ? err.stack : String(err);
    throw err;
  }

  async function waitFor(predicate, label, timeoutMs = 10000) {
    const deadline = performance.now() + timeoutMs;
    while (performance.now() < deadline) {
      if (predicate()) return;
      await new Promise((resolve) => setTimeout(resolve, 20));
    }
    throw new Error(`timed out waiting for ${label}`);
  }
</script>
