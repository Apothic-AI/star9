<!doctype html>
<meta charset="utf-8">
<title>wanix-web smoke</title>

<script>
  window.__wanixSmokeStore = {};
</script>

<wanix-system
  id="smoke-system"
  pkg="../target/wanix-web-pkg/wanix_web.js"
>
  <wanix-bind kind="ns" type="ns" dst="." src="#ramfs"></wanix-bind>
  <wanix-bind kind="file" type="file" dst="inline.txt">inline-browser-ok</wanix-bind>
  <wanix-bind
    kind="file"
    type="file"
    dst="fetched.txt"
    src="./fixtures/browser/registered-file.txt"
  ></wanix-bind>
  <wanix-bind
    kind="ns"
    type="ns"
    dst="cache-store"
    storage='{"backend":"cache","cache":"wanix-smoke","path":"root"}'
  ></wanix-bind>
  <wanix-bind
    kind="ns"
    type="ns"
    dst="dom-store"
    storage='{"backend":"dom","node":"#status"}'
  ></wanix-bind>
  <wanix-bind
    kind="ns"
    type="ns"
    dst="shared-store"
    storage='{"backend":"js-value","value":"window.__wanixSmokeStore"}'
  ></wanix-bind>
  <wanix-bind
    kind="ns"
    type="ns"
    dst="shared-store-2"
    storage='{"backend":"js-value","value":"window.__wanixSmokeStore"}'
  ></wanix-bind>
</wanix-system>

<pre id="status">running</pre>

<script type="module">
  import "../crates/wanix-web/js/wanix-elements.js";
  import { createWanixP9FramePort } from "../crates/wanix-web/js/p9-port.js";

  const status = document.querySelector("#status");
  const systemElement = document.querySelector("#smoke-system");
  const assert = (condition, message) => {
    if (!condition) throw new Error(message);
  };
  const entriesOf = async (path, system) => Array.from(await system.readDir(path));
  const numericTaskIds = (entries) =>
    entries
      .map((entry) => entry.replace(/\/$/, ""))
      .filter((entry) => /^\d+$/.test(entry))
      .map((entry) => Number(entry))
      .sort((left, right) => left - right);

  const waitForReady = (element, timeoutMs = 10000) =>
    new Promise((resolve, reject) => {
      if (element.isReady === true) {
        resolve({ detail: { system: element.system ?? element } });
        return;
      }

      const timeout = window.setTimeout(() => {
        cleanup();
        reject(new Error(`timed out waiting for ${element.tagName.toLowerCase()} ready`));
      }, timeoutMs);

      const cleanup = () => {
        window.clearTimeout(timeout);
        element.removeEventListener("ready", onReady);
        element.removeEventListener("error", onError);
      };

      const onReady = (event) => {
        cleanup();
        resolve(event);
      };

      const onError = (event) => {
        cleanup();
        const detail = event && event.detail ? event.detail.error ?? event.detail : event;
        reject(detail instanceof Error ? detail : new Error(String(detail)));
      };

      element.addEventListener("ready", onReady, { once: true });
      element.addEventListener("error", onError, { once: true });
    });

  try {
    const readyEvent = await waitForReady(systemElement);
    const system = readyEvent.detail.system;

    const version = (await system.readText("#wanix/version")).trim();
    const inlineText = (await system.readText("inline.txt")).trim();
    const fetchedText = (await system.readText("fetched.txt")).trim();

    await system.writeText("cache-store/state.txt", "storage-ok");
    const storageText = await system.readText("cache-store/state.txt");
    const storageEntries = await entriesOf("cache-store", system);

    await system.writeText("dom-store/textContent", "dom-storage-ok");
    const domStorageText = await system.readText("dom-store/textContent");

    await system.writeText("shared-store/state.txt", "descriptor-ok");
    const sharedMirrorText = (await system.readText("shared-store-2/state.txt")).trim();
    const sharedEntries = await entriesOf("shared-store-2", system);

    const portImport = await createWanixP9FramePort(system);
    await system.mountImportPort("remote-port", portImport.port);
    const remotePortInlineText = (await system.readText("remote-port/inline.txt")).trim();
    await system.writeText("remote-port/port-created.txt", "port-ok");
    const remotePortCreatedText = (await system.readText("port-created.txt")).trim();
    const remotePortEntries = await entriesOf("remote-port", system);
    system.unmount("remote-port");
    portImport.server.close();

    system.mountSelf9p("remote");
    const remoteInlineText = (await system.readText("remote/inline.txt")).trim();
    const remoteFetchedText = (await system.readText("remote/fetched.txt")).trim();

    if (navigator.storage && typeof navigator.storage.getDirectory === "function") {
      await system.mountStorage("opfs-store", { backend: "opfs", root: "wanix-smoke" });
      await system.writeText("opfs-store/state.txt", "opfs-ok");
      const opfsText = await system.readText("opfs-store/state.txt");
      assert(opfsText === "opfs-ok", `bad opfs text ${opfsText}`);
    }

    const taskEntriesBefore = await entriesOf("#task", system);
    const wasiTask = system.startWasi("repl.wasm");
    const taskEntriesAfterWasi = await entriesOf("#task", system);
    const goTask = system.startGoJs("repl-gojs.wasm");
    const taskEntriesAfterGo = await entriesOf("#task", system);
    const wasiCmd = (await system.readText(`#task/${wasiTask}/cmd`)).trim();
    const wasiExit = (await system.readText(`#task/${wasiTask}/exit`)).trim();
    const goCmd = (await system.readText(`#task/${goTask}/cmd`)).trim();
    const goExit = (await system.readText(`#task/${goTask}/exit`)).trim();

    const workerTask = await system.startBrowserWorker("./fixtures/browser/execution-worker.mjs", {
      workerId: "smoke-exec-worker",
      module: "../../../tests/fixtures/js-wasm-execution-runner.mjs",
      args: ["--browser-smoke"],
      env: [{ name: "FIXTURE_EXIT_CODE", value: "0" }],
      cwd: "tmp",
    });
    await waitFor(() => workerTask.exitCode === 0, "worker task exit");
    const workerPort = system.openWorkerPort(workerTask.worker, {
      port_id: "smoke-events",
      name: "smoke-events",
    });
    const handedPort = system.handoffWorkerPort(workerTask.worker, goTask, workerPort);
    const workerExit = (await system.readText(`#task/${workerTask.taskId}/exit`)).trim();
    const workerCmd = (await system.readText(`#task/${workerTask.taskId}/cmd`)).trim();
    const workerMessages = workerTask.messages.slice();
    workerTask.close();

    assert(version === "0.1.0", `bad version ${version}`);
    assert(inlineText === "inline-browser-ok", `bad inline text ${inlineText}`);
    assert(fetchedText === "registered-browser-ok", `bad fetched text ${fetchedText}`);
    assert(storageText === "storage-ok", `bad storage text ${storageText}`);
    assert(
      sharedMirrorText === "descriptor-ok",
      `bad shared storage text ${sharedMirrorText}`,
    );
    assert(
      remoteInlineText === "inline-browser-ok",
      `bad remote inline text ${remoteInlineText}`,
    );
    assert(
      remoteFetchedText === "registered-browser-ok",
      `bad remote fetched text ${remoteFetchedText}`,
    );
    assert(
      remotePortInlineText === "inline-browser-ok",
      `bad remote port inline text ${remotePortInlineText}`,
    );
    assert(
      remotePortCreatedText === "port-ok",
      `bad remote port created text ${remotePortCreatedText}`,
    );
    assert(
      remotePortEntries.includes("port-created.txt"),
      `missing remote port entry: ${remotePortEntries}`,
    );
    assert(
      domStorageText === "dom-storage-ok",
      `bad dom storage text ${domStorageText}`,
    );
    assert(
      storageEntries.includes("state.txt"),
      `missing storage entry: ${storageEntries}`,
    );
    assert(
      sharedEntries.includes("state.txt"),
      `missing shared entry: ${sharedEntries}`,
    );
    assert(Boolean(wasiTask) && Boolean(goTask) && wasiTask !== goTask, "bad task ids");
    assert(wasiCmd === "repl.wasm", `bad wasi cmd ${wasiCmd}`);
    assert(goCmd === "repl-gojs.wasm", `bad go cmd ${goCmd}`);
    assert(wasiExit === "started", `bad wasi exit ${wasiExit}`);
    assert(goExit === "started", `bad go exit ${goExit}`);
    assert(workerExit === "0", `bad worker exit ${workerExit}`);
    assert(
      workerCmd === "../../../tests/fixtures/js-wasm-execution-runner.mjs --browser-smoke",
      `bad worker cmd ${workerCmd}`,
    );
    assert(
      workerMessages.some((message) => message && message.args && message.args.includes("--browser-smoke")),
      `missing worker payload: ${JSON.stringify(workerMessages)}`,
    );
    assert(handedPort.port_id === "smoke-events", `bad handed port ${JSON.stringify(handedPort)}`);
    assert(
      numericTaskIds(taskEntriesAfterWasi).includes(Number(wasiTask)),
      `missing wasi task entry: ${taskEntriesAfterWasi}`,
    );
    assert(
      numericTaskIds(taskEntriesAfterGo).includes(Number(goTask)),
      `missing go task entry: ${taskEntriesAfterGo}`,
    );
    assert(
      numericTaskIds(taskEntriesBefore).includes(1),
      `missing root task entry: ${taskEntriesBefore}`,
    );
    assert(
      Number(goTask) === Number(wasiTask) + 1,
      `bad task order ${wasiTask}, ${goTask}`,
    );

    document.body.dataset.status = "ok";
    status.textContent = JSON.stringify(
      {
        version,
        inlineText,
        fetchedText,
        storageEntries,
        sharedEntries,
        remotePortEntries,
        domStorageText,
        wasiTask,
        goTask,
        workerTask: workerTask.taskId,
        workerExit,
        handedPort,
        taskEntriesAfterGo,
      },
      null,
      2,
    );
  } catch (err) {
    document.body.dataset.status = "error";
    status.textContent = err && err.stack ? err.stack : String(err);
    throw err;
  }

  async function waitFor(predicate, label, timeoutMs = 10000) {
    const deadline = performance.now() + timeoutMs;
    while (performance.now() < deadline) {
      if (predicate()) return;
      await new Promise((resolve) => setTimeout(resolve, 20));
    }
    throw new Error(`timed out waiting for ${label}`);
  }
</script>
