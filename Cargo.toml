[workspace]
members = [
    "crates/star9-cli",
    "crates/star9-core",
    "crates/star9-fs",
    "crates/star9-protocol",
    "crates/star9-runtime",
    "crates/star9-task",
    "crates/star9-vfs",
    "crates/star9-web",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://example.invalid/star9"
rust-version = "1.80"

[workspace.dependencies]
bitflags = { version = "2.6", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
portable-pty = "0.9"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
wasmi = "0.40.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = [
    "Blob",
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "MessageChannel",
    "MessagePort",
    "ReadableStream",
    "Window",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
