[workspace]
members = [
    "crates/wanix-cli",
    "crates/wanix-core",
    "crates/wanix-fs",
    "crates/wanix-protocol",
    "crates/wanix-runtime",
    "crates/wanix-task",
    "crates/wanix-vfs",
    "crates/wanix-web",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://example.invalid/wanix-rs"
rust-version = "1.80"

[workspace.dependencies]
bitflags = { version = "2.6", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
thiserror = "2"
wasmi = "0.40.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = [
    "Blob",
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "MessageChannel",
    "MessagePort",
    "ReadableStream",
    "Window",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
