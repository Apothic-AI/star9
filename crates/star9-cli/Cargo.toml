[dependencies]
clap.workspace = true
reedline.workspace = true
star9-core = { version = "0.1.0", path = "../star9-core" }
star9-fs = { version = "0.1.0", path = "../star9-fs" }
star9-protocol = { version = "0.1.0", path = "../star9-protocol" }
star9-rc = { version = "0.1.0", path = "../star9-rc" }
star9-runtime = { version = "0.1.0", path = "../star9-runtime" }
star9-shell = { version = "0.1.0", path = "../star9-shell" }
star9-task = { version = "0.1.0", path = "../star9-task" }
star9-vfs = { version = "0.1.0", path = "../star9-vfs" }

[build-dependencies]
wat = "1"
