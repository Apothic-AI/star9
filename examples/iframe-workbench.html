<!doctype html>
<meta charset="utf-8">
<title>Star 9 iframe import workbench</title>

<star9-system id="client" pkg="../target/star9-web-pkg/star9_web.js">
  <star9-bind kind="ns" dst="." src="#ramfs"></star9-bind>
</star9-system>

<iframe id="exporter" src="./export-source.html#source"></iframe>

<pre id="out">starting</pre>

<script type="module">
  import "../crates/star9-web/js/star9-elements.js";

  const client = document.querySelector("#client");
  const iframe = document.querySelector("#exporter");
  const iframeReady =
    iframe.contentDocument && iframe.contentDocument.readyState !== "loading"
      ? Promise.resolve()
      : new Promise((resolve) => iframe.addEventListener("load", resolve, { once: true }));
  await Promise.all([client.ready, iframeReady]);
  await client.mountImport("remote", "./export-source.html#source", { targetOrigin: "*" });
  document.querySelector("#out").textContent =
    (await client.readText("remote/shared.txt")).trim();
</script>
