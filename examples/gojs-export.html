<!doctype html>
<meta charset="utf-8">
<title>Star 9 worker export</title>

<star9-system id="star9" pkg="../target/star9-web-pkg/star9_web.js">
  <star9-bind kind="ns" dst="." src="#ramfs"></star9-bind>
</star9-system>

<pre id="out">starting</pre>

<script type="module">
  import "../crates/star9-web/js/star9-elements.js";

  const system = document.querySelector("#star9");
  await system.ready;
  const task = await system.startBrowserWorker("../tests/fixtures/browser/export-worker.mjs", {
    workerId: "example-export",
    module: "../tests/fixtures/js-wasm-execution-runner.mjs",
  });
  await waitFor(() => task.exportMounts.length === 1);
  const text = (await system.readText(`#task/${task.taskId}/export/guest.txt`)).trim();
  document.querySelector("#out").textContent = `task=${task.taskId}\nexport=${text}`;

  async function waitFor(predicate) {
    while (!predicate()) {
      await new Promise((resolve) => setTimeout(resolve, 20));
    }
  }
</script>
