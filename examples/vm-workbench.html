<!doctype html>
<meta charset="utf-8">
<title>Star 9 VM workbench</title>

<star9-system id="star9" pkg="../target/star9-web-pkg/star9_web.js">
  <star9-bind kind="ns" dst="." src="#ramfs"></star9-bind>
  <star9-terminal id="term" raw></star9-terminal>
</star9-system>

<pre id="out">starting</pre>

<script type="module">
  import "../crates/star9-web/js/star9-elements.js";

  const system = document.querySelector("#star9");
  const term = document.querySelector("#term");
  await Promise.all([system.ready, term.ready]);
  const vm = (await system.readText("#vm/new/v86")).trim();
  await system.writeExistingText(`#vm/${vm}/ctl`, "start");
  await term.writeProgram("raw input\n");
  const raw = await system.readText(term.path("raw"));
  document.querySelector("#out").textContent = [
    `vm=${vm}`,
    `state=${(await system.readText(`#vm/${vm}/state`)).trim()}`,
    `raw=${JSON.stringify(raw)}`,
  ].join("\n");
</script>
